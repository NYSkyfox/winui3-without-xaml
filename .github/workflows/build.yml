# 仅手动触发：在仓库 Actions 页面点 "Run workflow" 按钮运行
name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [ Release ]
        platform: [ x64 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show MSBuild / NuGet versions
        run: |
          msbuild -version
          nuget help | Select-Object -First 3

      - name: Restore
        run: msbuild winui3-without-xaml.sln /t:Restore /v:minimal

      - name: Build
        run: |
          msbuild winui3-without-xaml.sln `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /m /nologo /v:minimal `
            /p:WindowsAppSDKSelfContained=true

      - name: List output
        run: |
          Get-ChildItem -Recurse -File -Path "${{ matrix.platform }}/${{ matrix.configuration }}" |
            Select-Object FullName, Length |
            Format-Table -AutoSize
          $total = (Get-ChildItem -Recurse -File -Path "${{ matrix.platform }}/${{ matrix.configuration }}" |
            Measure-Object -Property Length -Sum).Sum
          Write-Host "=== Total output size: $([math]::Round($total/1MB, 1)) MB ==="

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: winui3-without-xaml-${{ matrix.platform }}-${{ matrix.configuration }}
          path: ${{ matrix.platform }}/${{ matrix.configuration }}
          retention-days: 30
          if-no-files-found: error